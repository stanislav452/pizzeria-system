# Параметри підключення до БД.
# Змініть ці значення, щоб перейти, наприклад, на PostgreSQL:
#   db.url=jdbc:postgresql://localhost:5432/pizzeria
#   db.username=postgres
#   db.password=postgres
#   db.driver=org.postgresql.Driver
# (для PostgreSQL додайте JDBC-драйвер у pom.xml)
db.url=jdbc:h2:file:./data/pizzeria;DB_CLOSE_ON_EXIT=FALSE
db.username=sa
db.password=
db.driver=org.h2.Driver

# Налаштування пулу HikariCP
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.connectionTimeoutMs=5000
db.pool.poolName=pizzeria-pool
